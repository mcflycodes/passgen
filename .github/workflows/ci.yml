# Fast pull-request and main checks. Every third-party action is pinned to a
# full commit SHA; the comment after each pin names the release it came from.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify changes (unknown paths require browser and server tests)
        id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.sha }}
        run: node scripts/ci-changes.ts

  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format check
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Reference header snippets match the definition
        run: pnpm headers:check

  build:
    name: Build, domain and host independence, manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production build
        run: pnpm build
      - name: Domain and host independence
        run: pnpm verify:dist
      - name: SHA-256 manifest
        run: |
          pnpm manifest
          cat dist-manifest/SHA256SUMS
      - name: Publish the build and its manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passgen-dist-${{ github.sha }}
          path: |
            dist/
            dist-manifest/
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Desktop end-to-end (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # JSON syntax lets the unit-test coverage guard read this without a YAML dependency.
        # Chromium's full matrix exceeds five minutes without sharding.
        include: [{"project":"chromium","shard":1,"label":"chromium 1/2"},{"project":"chromium","shard":2,"label":"chromium 2/2"},{"project":"firefox","shard":0,"label":"firefox"},{"project":"webkit","shard":0,"label":"webkit"}]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify the selected Node and pnpm versions inside the container
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "$(node -p 'require("./package.json").engines.pnpm')"
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production build
        run: pnpm build
      - name: Tests against the built files served with the reference headers
        env:
          PASSGEN_E2E_PROJECTS: ${{ matrix.project }}
          PASSGEN_E2E_MODE: pr
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: |
          if [ "$PLAYWRIGHT_SHARD" = 0 ]; then
            pnpm test:e2e
          else
            pnpm test:e2e --shard="$PLAYWRIGHT_SHARD/2" --grep-invert "@a11y-matrix"
            pnpm test:e2e --shard="$PLAYWRIGHT_SHARD/2" --grep "@a11y-matrix"
          fi
      - name: Combined-gate regressions (injected fixtures through build, verify-dist and browser checks)
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: pnpm test:gate
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-pr-${{ matrix.project }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  supply-chain:
    name: Dependencies, licenses and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: No runtime dependencies, exact pins, supply-chain settings
        run: pnpm deps:check
      - name: License check
        run: pnpm licenses:check
      - name: Dependency audit
        run: pnpm run audit

  server-configs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Real Apache, nginx and Caddy examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build once without cache and check the shipped examples
        run: |
          pnpm headers:check
          pnpm build
          pnpm verify:dist
          pnpm manifest
      - name: Validate and probe each real server over trusted HTTPS
        env:
          HTTPD_IMAGE: public.ecr.aws/docker/library/httpd:2.4@sha256:c842ac797bd1fe8b3cd26d002ac9d948aa2814097544600600b35aef42e6785a
          NGINX_IMAGE: public.ecr.aws/docker/library/nginx:stable@sha256:9bf97bd7714f5e24c1ccd545ecb9eb5435cb6d109c97cebb15e7e455e0239edb
          CADDY_IMAGE: public.ecr.aws/docker/library/caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
        run: |
          echo '127.0.0.1 passgen.test' | sudo tee -a /etc/hosts
          mkdir -p "$RUNNER_TEMP/passgen-configs"
          TMPDIR="$RUNNER_TEMP/passgen-configs" bash scripts/test-server-configs.sh

  result:
    name: CI result
    needs: [changes, static, build, e2e, supply-chain, server-configs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job and only allow planned skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const code = jobs.changes.outputs.code;
          if (!['true', 'false'].includes(code)) process.exit(1);
          for (const [name, job] of Object.entries(jobs)) {
            const plannedSkip = code === 'false' && ['e2e', 'server-configs'].includes(name);
            if (job.result !== 'success' && !(plannedSkip && job.result === 'skipped')) {
              console.error(`${name}: ${job.result}`);
              process.exitCode = 1;
            }
          }
          JS
