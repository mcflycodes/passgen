# Required checks from decision 0004. Every third-party action is pinned to a
# full commit SHA; the comment after each pin names the release it came from.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format check
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Reference header snippets match the definition
        run: pnpm headers:check

  build:
    name: Build, domain and host independence, manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production build
        run: pnpm build
      - name: Domain and host independence
        run: pnpm verify:dist
      - name: SHA-256 manifest
        run: |
          pnpm manifest
          cat dist-manifest/SHA256SUMS
      - name: Publish the build and its manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passgen-dist-${{ github.sha }}
          path: |
            dist/
            dist-manifest/
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: End-to-end (${{ matrix.project }}, shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        # JSON syntax lets the unit-test coverage guard read this without a YAML dependency.
        project: ["chromium", "firefox", "webkit", "mobile-chrome", "mobile-safari"]
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify the selected Node and pnpm versions inside the container
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "$(node -p 'require("./package.json").engines.pnpm')"
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Production build
        run: pnpm build
      - name: Tests against the built files served with the reference headers
        env:
          PASSGEN_E2E_PROJECTS: ${{ matrix.project }}
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        # Playwright cuts the ordered test list into contiguous shards, so the long
        # accessibility matrix (tagged @a11y-matrix, first in file order) would all
        # land in shard 1. Sharding each class on its own spreads it evenly.
        run: |
          pnpm test:e2e --shard="$PLAYWRIGHT_SHARD/3" --grep-invert "@a11y-matrix"
          pnpm test:e2e --shard="$PLAYWRIGHT_SHARD/3" --grep "@a11y-matrix"
      - name: Combined-gate regressions (injected fixtures through build, verify-dist and browser checks)
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: pnpm test:gate
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  supply-chain:
    name: Dependencies, licenses and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: No runtime dependencies, exact pins, supply-chain settings
        run: pnpm deps:check
      - name: License check
        run: pnpm licenses:check
      - name: Dependency audit
        run: pnpm run audit
