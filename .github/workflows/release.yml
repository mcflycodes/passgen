name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate tag, ancestry and successful CI on this commit
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release.ts

  full-suite:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/full-suite.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}

  build:
    needs: [validate, full-suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install from the lockfile, install scripts blocked
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fast release gates and build
        run: |
          pnpm deps:check
          pnpm attribution:check
          pnpm html-sinks:check
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm headers:check
          pnpm styles:check
          pnpm build
          pnpm verify:dist
          pnpm manifest
      - name: Package and check release notes
        run: |
          python3 scripts/package-release.py
          node scripts/release-notes.ts
      - name: Upload release assets and notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passgen-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, full-suite, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passgen-release
          path: release/
      - name: Verify remote tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION")
          type=$(jq -er '.object.type' <<< "$object")
          sha=$(jq -er '.object.sha' <<< "$object")
          depth=0
          while [ "$type" = tag ]; do
            test "$depth" -lt 16
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -er '.object.type' <<< "$object")
            sha=$(jq -er '.object.sha' <<< "$object")
            depth=$((depth + 1))
          done
          test "$type" = commit
          test "$sha" = "$RELEASE_COMMIT"
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PassGen $RELEASE_VERSION" --notes-file release/notes.md "release/passgen-$RELEASE_VERSION.zip" release/SHA256SUMS "release/passgen-$RELEASE_VERSION.zip.sha256"
