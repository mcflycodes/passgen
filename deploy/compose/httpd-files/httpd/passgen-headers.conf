# Generated from security/headers.ts by `pnpm headers:gen`. Do not edit by hand.
#
# Apache httpd with mod_headers. Include this file in the <VirtualHost> or <Directory>
# that serves the PassGen files, or copy it into a .htaccess file there.
# It is deliberately not wrapped in <IfModule>: if mod_headers is missing, Apache
# should refuse to start rather than serve the page without its headers.
# `always` makes Apache add the headers to error responses such as 404 too.

# Same-origin code only, no inline script, no network requests (S4).
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; child-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'"
# HTTPS only for two years (T6). Ignored by browsers over plain HTTP.
Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
# Files are only run as the type the server declares.
Header always set X-Content-Type-Options "nosniff"
# No framing, for browsers that ignore CSP frame-ancestors (T7).
Header always set X-Frame-Options "DENY"
# Never send this page's URL to anyone.
Header always set Referrer-Policy "no-referrer"
# Switch off every browser feature except writing to the clipboard.
Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
# Other sites' windows get no handle on this page.
Header always set Cross-Origin-Opener-Policy "same-origin"
# Only resources that opt in can load, isolating the page.
Header always set Cross-Origin-Embedder-Policy "require-corp"
# Other sites cannot embed this site's files.
Header always set Cross-Origin-Resource-Policy "same-origin"
