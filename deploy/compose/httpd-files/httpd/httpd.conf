# Generated by pnpm headers:gen. Edit scripts/lib/site-configs.ts instead.
# Docker Compose recipe: the official httpd image as a non-root user with a
# read-only root filesystem. Only /tmp is written: the PID file and mutexes.
# Plain HTTP behind an HTTPS proxy; only the modules the site needs are loaded.
ServerRoot "/usr/local/apache2"
Listen 8080
ServerName localhost
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule dir_module modules/mod_dir.so
ServerTokens Prod
ServerSignature Off
TraceEnable Off
TypesConfig conf/mime.types
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\"" proxied
CustomLog /proc/self/fd/1 proxied
Include /etc/passgen/passgen-site.conf
