# nginx drops inherited add_header lines in any block that has its own add_header,
# so include this file in every such block.
# `always` makes nginx add the headers to error responses such as 404 too.

# Same-origin code only, no inline script, no network requests (S4).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; child-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
# HTTPS only for two years (T6). Ignored by browsers over plain HTTP.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
# Files are only run as the type the server declares.
add_header X-Content-Type-Options "nosniff" always;
# No framing, for browsers that ignore CSP frame-ancestors (T7).
add_header X-Frame-Options "DENY" always;
# Never send this page's URL to anyone.
add_header Referrer-Policy "no-referrer" always;
# Switch off every browser feature except writing to the clipboard.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
# Other sites' windows get no handle on this page.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only resources that opt in can load, isolating the page.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Other sites cannot embed this site's files.
add_header Cross-Origin-Resource-Policy "same-origin" always;
